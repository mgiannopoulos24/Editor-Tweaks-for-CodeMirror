<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weekend Recipes</title>
	<style>
		body {
			max-width: 720px;
			margin: 0 auto;
			padding: 2rem;
			font-family: Georgia, serif;
		}
		.recipe {
			border-bottom: 1px solid #ddd;
			padding-bottom: 1rem;
		}
	</style>
</head>
<body>
	<header>
		<h1>Weekend Recipes</h1>
		<nav>
			<a href="#breakfast">Breakfast</a> |
			<a href="#dinner">Dinner</a>
		</nav>
	</header>

	<main>
		<article class="recipe" id="breakfast">
			<h2>Lemon Pancakes</h2>
			<p>Ready in <strong>20 minutes</strong>. Serves 4.</p>
			<ul>
				<li>200 g flour</li>
				<li>2 eggs</li>
				<li>300 ml milk</li>
				<li>Zest of 1 lemon</li>
			</ul>
			<img src="pancakes.jpg" alt="A stack of pancakes" width="320" height="200">
		</article>

		<form action="/subscribe" method="post">
			<label for="email">Get new recipes by email:</label>
			<input type="email" id="email" name="email" placeholder="you@example.com" required>
			<button type="submit">Subscribe</button>
		</form>
	</main>

	<!-- Footer -->
	<footer>
		<p>&copy; 2026 Weekend Recipes</p>
	</footer>

	<script>
		document.querySelector('form').addEventListener('submit', (event) => {
			console.log('Subscribing', event.target.email.value);
		});
	</script>
</body>
</html>
